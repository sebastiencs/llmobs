name: Advisories

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC; off the hour to avoid the scheduler rush
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
        with:
          cache: "false"
      - run: just deny-advisories
