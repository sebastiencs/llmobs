name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short
  # Kache permits PR uploads only to a separate prefix; protected main ignores it.
  KACHE_PULL_REQUEST_PREFIX: kache-pr-v2
  # Only main and owner-authored, owner-triggered same-repository PRs may use R2.
  # Check the re-run actor too; re-running another author's PR does not grant access.
  CI_CACHE_ALLOWED: >-
    ${{
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == 'sebastiencs' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == 'sebastiencs' && github.triggering_actor == 'sebastiencs')
    }}

jobs:
  rust-lint:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-r2
      deployment: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
        with:
          cache: ${{ env.CI_CACHE_ALLOWED }}
          r2-access-key-id: ${{ env.CI_CACHE_ALLOWED == 'true' && secrets.R2_ACCESS_KEY_ID || '' }}
          r2-secret-access-key: ${{ env.CI_CACHE_ALLOWED == 'true' && secrets.R2_SECRET_ACCESS_KEY || '' }}
      - run: just fmt-check lint
      - run: just assert-clean

  rust-test:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-r2
      deployment: false
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
        with:
          cache: ${{ env.CI_CACHE_ALLOWED }}
          r2-access-key-id: ${{ env.CI_CACHE_ALLOWED == 'true' && secrets.R2_ACCESS_KEY_ID || '' }}
          r2-secret-access-key: ${{ env.CI_CACHE_ALLOWED == 'true' && secrets.R2_SECRET_ACCESS_KEY || '' }}
      - run: just test
      - run: just assert-clean

  rust-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
        with:
          cache: "false"
      - run: just deny
      - run: just assert-clean

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/js # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
      - run: just check-web
      - run: just assert-clean

  ts-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/js # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
      - run: just check-ts
      - run: just assert-clean

  ts-sdk-min-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/js # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
      - run: just js-install
      - run: pnpm --dir sdks/typescript run build
      - run: pnpm --dir sdks/typescript pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
      - name: Load the packed SDK on Node 22.12
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=("$RUNNER_TEMP"/llmobs-*.tgz)
          if (( ${#tarballs[@]} != 1 )); then
            printf 'expected one tarball, found %s\n' "${#tarballs[@]}"
            exit 1
          fi
          just ts-smoke "${tarballs[0]}"
      # pnpm 11 requires Node >= 22.13. vitest 5.1.0 allows Node ^22.12.0.
      - name: Test the TypeScript SDK on Node 22.12
        working-directory: sdks/typescript
        run: node node_modules/vitest/vitest.mjs run
      - run: just assert-clean

  python-sdk:
    name: python-sdk (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: sdks/python/uv.lock
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: just@1.59.0
      - run: just check-py
      - run: just assert-clean

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: just@1.59.0
      - name: Install actionlint
        shell: bash
        # taiki-e/install-action v2.89.1 has no actionlint manifest.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install zizmor
        # v2.89.1's manifest stops at zizmor 1.31.1; 1.32.0 is the latest release older than 7 days.
        run: uv tool install zizmor==1.32.0
      - run: just check-workflows
      - run: just assert-clean

  ci-ok:
    if: always()
    needs:
      [
        rust-lint,
        rust-test,
        rust-deny,
        web,
        ts-sdk,
        ts-sdk-min-node,
        python-sdk,
        workflows,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded
        run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true
