name: Rust
description: Install the repo toolchain, just, and cargo-deny

inputs:
  cache:
    description: Read and save the S3 compiler cache for a trusted CI run.
    required: false
    default: "true"
  s3-access-key-id:
    description: Bucket-scoped Garage access key ID with read and write permission.
    required: false
  s3-secret-access-key:
    description: Secret access key paired with s3-access-key-id.
    required: false

runs:
  using: composite
  steps:
    - name: Install the Rust toolchain
      shell: bash
      # No arguments: rustup installs the channel and components in rust-toolchain.toml.
      run: rustup toolchain install

    - name: Install mold 3.0.0
      shell: bash
      # Pinned release, not apt: ubuntu 24.04 ships mold 2.30. The jobs link with
      # mold via RUSTFLAGS in ci.yml (-Clinker-features=-lld -Clink-arg=-fuse-ld=mold).
      run: |
        set -euo pipefail
        curl -fsSL -o /tmp/mold.tar.gz \
          https://github.com/rui314/mold/releases/download/v3.0.0/mold-3.0.0-x86_64-linux.tar.gz
        sudo tar -xzf /tmp/mold.tar.gz --strip-components=1 -C /usr/local

    - name: Cache Rust compilation with kache and Garage
      # The caller enables caching and supplies credentials only for trusted runs.
      if: inputs.cache == 'true' && inputs.s3-access-key-id != '' && inputs.s3-secret-access-key != ''
      uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
      with:
        version: "2.0.0"
        s3-bucket: kache
        s3-endpoint: https://s3.chapu.is
        s3-region: us-east-1
        s3-prefix: kache-v2
        s3-access-key-id: ${{ inputs.s3-access-key-id }}
        s3-secret-access-key: ${{ inputs.s3-secret-access-key }}
        # Clippy and test jobs must not overwrite each other's prefetch manifests.
        manifest-key: ${{ github.job }}
        cache-executables: true
        github-cache: false
        save-cache: true
        # Reports go in the job summary; the workflow token stays contents:read.
        pr-comment: false

    - name: Install just and cargo-deny
      uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      with:
        tool: just@1.59.0,cargo-deny@0.20.2
