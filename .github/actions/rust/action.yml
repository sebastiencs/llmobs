name: Rust
description: Install the repo toolchain, just, and cargo-deny

inputs:
  cache:
    description: Restore the cargo target cache. PRs restore but do not save.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install the Rust toolchain
      shell: bash
      # No arguments: rustup installs the channel and components in rust-toolchain.toml.
      run: rustup toolchain install

    - name: Cache cargo build artifacts
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        # Clippy and test builds produce different artifacts.
        key: ${{ github.job }}
        # PRs restore an existing cache and never save one.
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install just and cargo-deny
      uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
      with:
        tool: just@1.59.0,cargo-deny@0.20.2
