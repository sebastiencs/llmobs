name: Rust
description: Install the repo toolchain, just, and cargo-deny

inputs:
  cache:
    description: Use the R2 compiler cache. PRs restore but do not save.
    required: false
    default: "true"
  r2-access-key-id:
    description: Bucket-scoped R2 access key ID; use a read-only key for PRs.
    required: false
  r2-secret-access-key:
    description: Secret access key paired with r2-access-key-id.
    required: false

runs:
  using: composite
  steps:
    - name: Install the Rust toolchain
      shell: bash
      # No arguments: rustup installs the channel and components in rust-toolchain.toml.
      run: rustup toolchain install

    - name: Cache Rust compilation with kache and R2
      # Fork and Dependabot PRs have no R2 secrets and compile without the cache.
      if: inputs.cache == 'true' && inputs.r2-access-key-id != '' && inputs.r2-secret-access-key != ''
      uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
      with:
        version: "2.0.0"
        s3-bucket: llmobs-cache
        s3-endpoint: https://f575c8aba37f5d64c55d2e211037990f.r2.cloudflarestorage.com
        s3-region: auto
        s3-prefix: kache-v2
        s3-access-key-id: ${{ inputs.r2-access-key-id }}
        s3-secret-access-key: ${{ inputs.r2-secret-access-key }}
        # Clippy and test jobs must not overwrite each other's prefetch manifests.
        manifest-key: ${{ github.job }}
        cache-executables: true
        github-cache: false
        save-cache: ${{ github.ref == 'refs/heads/main' }}
        # Reports go in the job summary; the workflow token stays contents:read.
        pr-comment: false

    - name: Install just and cargo-deny
      uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      with:
        tool: just@1.59.0,cargo-deny@0.20.2
