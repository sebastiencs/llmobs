version: 2
updates:
  - package-ecosystem: github-actions
    # Composite actions are only scanned in directories listed here.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    ignore:
      # DataFusion picks the arrow, parquet and object_store majors. A major of these moves
      # only with a DataFusion major, and that PR is completed by hand (AGENTS.md
      # § Dependencies). Arrow 60 renamed the map entry fields to `key`/`value`; see
      # docs/plans/maintenance/01-first-dependabot-batch.md before that upgrade.
      - dependency-name: "arrow"
        update-types: ["version-update:semver-major"]
      - dependency-name: "arrow-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "parquet"
        update-types: ["version-update:semver-major"]
      - dependency-name: "object_store"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      # No update-types: majors of this family move together (AGENTS.md).
      datafusion-family:
        patterns:
          - "datafusion"
          - "datafusion-*"
          - "arrow"
          - "arrow-*"
          - "parquet"
          - "object_store"
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    ignore:
      # openapi-typescript 7.13.0 declares typescript ^5.x and uses the JS compiler API,
      # which TypeScript 7 does not ship. Remove when openapi-typescript supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tanstack-router:
        patterns:
          - "@tanstack/react-router"
          - "@tanstack/router-*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      openapi:
        patterns:
          - "openapi-fetch"
          - "openapi-react-query"
          - "openapi-typescript"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /sdks/python
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      uv-dev:
        patterns:
          - "*"
