[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # sqlx 0.9.0 requires libsqlite3-sys <0.38. The patched release is 0.39.0.
    { id = "RUSTSEC-2026-0459", reason = "sqlx 0.9.0 requires libsqlite3-sys <0.38; the fix is libsqlite3-sys 0.39.0" },
    # object_store 0.13's aws feature requires quick-xml ^0.39. The fixes are 0.41.
    { id = "RUSTSEC-2026-0194", reason = "object_store 0.13 requires quick-xml ^0.39; the fix is quick-xml 0.41" },
    { id = "RUSTSEC-2026-0195", reason = "object_store 0.13 requires quick-xml ^0.39; the fix is quick-xml 0.41" },
    # openidconnect 4.1.0 requires rsa ^0.9. The Marvin fix is rsa 0.10, which that crate does not accept.
    # The mock IdP signs with rsa 0.10. openidconnect uses the 0.9 copy to verify signatures.
    { id = "RUSTSEC-2023-0071", reason = "openidconnect 4.1.0 requires rsa ^0.9; the Marvin fix is rsa 0.10, which that crate does not accept" },
]

[licenses]
# D172 settled D9: the core is MIT, `ee/` directories are Elastic-2.0 (D-P-2, D-P-3).
# The allow-list is the set of licences in the dependency graph on 2026-11-14.
# Adding a licence here is a review decision; copyleft licences other than MPL-2.0
# (file-level, used by `option-ext`) are not allowed.
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
# Workspace crates are unpublished (`publish = false`); their own licences are in LICENSE.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # path deps between workspace crates
highlight = "all"
# The DataFusion family is pinned together (AGENTS.md § Dependencies): two versions of any
# of these crates in the graph means the family is split. cargo-deny has no wildcard for
# crate names, so every arrow sub-crate is listed.
deny = [
    { crate = "datafusion", deny-multiple-versions = true },
    { crate = "datafusion-datasource", deny-multiple-versions = true },
    { crate = "arrow", deny-multiple-versions = true },
    { crate = "arrow-arith", deny-multiple-versions = true },
    { crate = "arrow-array", deny-multiple-versions = true },
    { crate = "arrow-buffer", deny-multiple-versions = true },
    { crate = "arrow-cast", deny-multiple-versions = true },
    { crate = "arrow-csv", deny-multiple-versions = true },
    { crate = "arrow-data", deny-multiple-versions = true },
    { crate = "arrow-ipc", deny-multiple-versions = true },
    { crate = "arrow-json", deny-multiple-versions = true },
    { crate = "arrow-ord", deny-multiple-versions = true },
    { crate = "arrow-row", deny-multiple-versions = true },
    { crate = "arrow-schema", deny-multiple-versions = true },
    { crate = "arrow-select", deny-multiple-versions = true },
    { crate = "arrow-string", deny-multiple-versions = true },
    { crate = "parquet", deny-multiple-versions = true },
    { crate = "object_store", deny-multiple-versions = true },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
