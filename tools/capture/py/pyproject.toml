[project]
name = "llmobs-capture-scenarios"
version = "0.0.0"
requires-python = "==3.13.*"
dependencies = [
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
  "openai==3.45.0",
  "anthropic==2.4.0",
  "openinference-instrumentation-openai==0.1.69",
  "openinference-instrumentation-anthropic==3.3.0",
  "openinference-instrumentation-google-genai==1.5.0",
  "openinference-instrumentation-langchain==0.1.81",
  "openinference-instrumentation-openai-agents==2.7.0",
  "langchain==1.4.8",
  "langchain-openai==1.7.3",
  "langgraph==1.2.19",
  "openai-agents==0.24.0",
  "opentelemetry-instrumentation-openai-v2==2.4b0",
  "opentelemetry-instrumentation-google-genai==1.1b1",
  "opentelemetry-util-genai==1.1b0",
  "google-genai==2.34.0",
  "opentelemetry-instrumentation-openai==0.62.4",
  "opentelemetry-instrumentation-anthropic==0.62.4",
  "opentelemetry-instrumentation-google-generativeai==0.62.4",
  "opentelemetry-instrumentation-langchain==0.62.4",
  "opentelemetry-instrumentation-openai-agents==0.62.4",
  "traceloop-sdk==0.62.4",
  "langfuse==5.1.0",
  "lmnr==0.8.8",
  # 2.13.0 caps opentelemetry-sdk at 1.44, which langfuse 5.1.0 rejects (>=1.45).
  # 2.14.0 (2026-11-07) is the first release that accepts the pinned 1.45.2.
  "google-adk==2.14.0",
  "openinference-instrumentation-google-adk==1.1.0",
]

[dependency-groups]
dev = ["ruff==0.17.3", "mypy==2.4.1"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days" # D74/D117: no release younger than 7 days
# google-adk 2.14.0 was uploaded on 2026-11-07. The 7-day cutoff excludes it,
# and 2.13.0 cannot share this project's OpenTelemetry 1.45 pin.
exclude-newer-package = { google-adk = "2026-11-07T01:04:00Z" }

[tool.uv.build-backend]
module-name = "capture_py"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "ANN", "S", "BLE", "N"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "scenarios"]
mypy_path = "src"
# Every scenario entry point is main.py. mypy maps those paths to one module.
exclude = ["main\\.py$"]

[[tool.mypy.overrides]]
module = "opentelemetry.instrumentation.openai_v2"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "opentelemetry.instrumentation.google_generativeai"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "opentelemetry.instrumentation.langchain"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "opentelemetry.instrumentation.openai_agents"
follow_imports = "skip"
