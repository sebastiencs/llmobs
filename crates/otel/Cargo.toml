[package]
name = "llmobs-otel"
description = "OTLP decoding, convention detection, normalization, and cost"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true
llmobs-core.workspace = true
opentelemetry-proto.workspace = true
prost.workspace = true
regex.workspace = true
serde.workspace = true
# Payload JSON is parsed and re-serialized; numbers must round-trip exactly
# whatever features the rest of the workspace unifies in.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Integration tests encode fixture bytes directly.
base64.workspace = true
# Integration tests are a separate crate. They name OTLP and prost types directly.
opentelemetry-proto.workspace = true
prost.workspace = true
# Property tests (N23). `std` is enough for the strategies used here.
proptest = { workspace = true, default-features = false, features = ["std"] }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
