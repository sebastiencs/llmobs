<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ product }}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f4f5;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#ffffff;border-radius:8px;">
            <tr>
              <td style="padding:32px;font-family:sans-serif;font-size:16px;line-height:1.5;color:#18181b;">
{%- if inviter_name -%}
                <p style="margin:0 0 16px;">{{ inviter_name }} invited you to join {{ org_name }} on {{ product }} as {{ role }}.</p>
{%- else -%}
                <p style="margin:0 0 16px;">You are invited to join {{ org_name }} on {{ product }} as {{ role }}.</p>
{%- endif %}
                <p style="margin:0;"><a href="{{ url }}" style="color:#1d4ed8;text-decoration:underline;">{{ url }}</a></p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
