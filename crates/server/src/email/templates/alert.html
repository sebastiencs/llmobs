<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ state }}: {{ rule_name }}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f4f5;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#ffffff;border-radius:8px;">
            <tr>
              <td style="padding:32px;font-family:sans-serif;font-size:16px;line-height:1.5;color:#18181b;">
                <p style="margin:0 0 16px;font-weight:600;">{{ state }}: {{ rule_name }}</p>
                <p style="margin:0 0 16px;">{{ project_name }} · {{ value }} (threshold {{ threshold }}) over {{ window }}</p>
                <p style="margin:0;"><a href="{{ rule_url }}">View the rule</a> · <a href="{{ traces_url }}">View the traces</a></p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
