[workspace]
resolver = "3"
members = ["crates/*", "tools/capture"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/sebastiencs/llmobs"
# license: intentionally omitted until D9 is decided

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
large_futures = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
inefficient_to_string = "warn"

[workspace.dependencies]
# workspace crates
llmobs-core = { path = "crates/core" }
llmobs-eval = { path = "crates/eval" }
llmobs-otel = { path = "crates/otel" }
llmobs-storage = { path = "crates/storage" }
llmobs-server = { path = "crates/server" }
llmobs-ui = { path = "crates/ui" }

# --- pinned families (must stay mutually compatible) ---
# datafusion 55.2.0 depends on arrow/parquet 59.2 and object_store 0.13.2.
# Those are caret-pinned here, not the newer arrow/parquet 60 or object_store 0.14.
# `compression` is omitted from DataFusion's default features: it pulls xz, bzip2,
# gzip, and zstd for DataFusion's own file readers. Parquet readers enable the
# codecs we accept on the `parquet` pin below.
# Same release as `datafusion`. `MemorySourceConfig` is not re-exported from the
# `datafusion` crate; this is the crate that defines it. Keep default features
# off so the compression codecs DataFusion's own pin excludes stay out.
datafusion-datasource = { version = "55.2", default-features = false }
datafusion = { version = "55.2", default-features = false, features = [
    "nested_expressions",
    "crypto_expressions",
    "datetime_expressions",
    "encoding_expressions",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
    "parquet",
    "recursive_protection",
    "sql",
] }
arrow = { version = "59.2", default-features = false }
# parquet 59 has no `flate2` feature. `flate2-zlib-rs` is that release's deflate backend.
parquet = { version = "59.2", default-features = false, features = [
    "arrow",
    "async",
    "object_store",
    "zstd",
    "snap",
    "lz4",
    "flate2-zlib-rs",
] }
object_store = "0.13"
# catalog.db (D39). `macros` exists for `sqlx::migrate!` only. Queries use the
# runtime API, not `query!`, so no `DATABASE_URL` is required. `sqlite` bundles
# SQLite so the binary does not need a system library.
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }

# --- runtime basics ---
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
# RFC 9535 JSONPath on mapping expressions (D162).
serde_json_path = "0.7.2"
# Judge prompt templates (D163) and email templates (spec 08; `.html` names auto-escape).
# Self-contained templates: no macros, imports, or debug.
minijinja = { version = "3.1.0", default-features = false, features = [
    "builtins",
    "fuel",
    "serde",
    "json",
] }
thiserror = "2.0"
# Server config (spec 12). `env` is enabled because `LLMOBS_*` is an env source;
# the loader builds that source from an explicit map so tests do not touch the
# process environment. `toml` reads `llmobs.toml`.
figment = { version = "0.10.19", features = ["toml", "env"] }
# `trusted_proxies` CIDRs (D142).
ipnet = { version = "2.12.2", features = ["serde"] }
# `public_url` parsing. Already in `Cargo.lock` (2.5.8).
url = "2.5.8"
# SMTP (spec 08). Default features include `native-tls`; rustls only.
# `hostname` is the EHLO and generated `Message-ID` domain.
lettre = { version = "0.11.23", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "tokio1-rustls-tls",
] }
# HTTP router (P4). No `tracing` feature: axum's span would record the URI (D150).
# `matched-path` is the route template request logs use.
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "json",
    "matched-path",
    "query",
    "tokio",
] }
# `ServiceExt::oneshot` for HTTP tests (D151).
tower = { version = "0.5.3", default-features = false, features = ["util"] }
# Session cookie parsing (P9). Default features stay off so `axum/tracing` is not enabled (D150).
axum-extra = { version = "0.12.6", default-features = false, features = ["cookie"] }
# MCP server (D-H-2): streamable HTTP, stateless, JSON responses. `server` gives
# `ServerHandler`; no `macros`: the server implements it by hand.
rmcp = { version = "3.10.0", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
] }
# Field path of a JSON or query error, without the rejected value (P4).
serde_path_to_error = "0.1.20"
# Email normalization: trim, NFC, lowercase (P6, D136).
unicode-normalization = "0.1.26"
# DataFusion 55's `TableProvider` is an `#[async_trait]` trait.
async-trait = "0.1.92"
hex = "0.4.3"
bytes = "1.12"
futures = "0.3.34"
strum = { version = "0.28.0", features = ["derive"] }
insta = { version = "1.49.0", features = ["json"] }
jsonschema = { version = "0.60.2", default-features = false }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
clap = { version = "4.6", features = ["derive", "env"] }
mimalloc = { version = "0.1", default-features = false }
uuid = { version = "1.29", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
# WAL record checksum (spec 03 §1).
crc32c = "0.6.9"
# `[storage]` sizes, for example `"256MiB"` (D90).
bytesize = { version = "2.7.0", features = ["serde"] }
# `[storage]` durations, for example `"120s"` (D90).
humantime-serde = "1.1.1"
# Total memory for the query pool default (spec 03 §6).
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
# Free disk for the disk-full check (spec 03 §10).
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }
# Same prost as `opentelemetry-proto` 0.33.1 (`Cargo.lock`). Decode only; no `derive`.
prost = { version = "0.14.4", default-features = false, features = ["std"] }
# OTLP messages and the tonic `TraceService` (server and test client).
opentelemetry-proto = { version = "0.33.1", default-features = false, features = [
    "gen-tonic",
    "gen-tonic-messages",
    "trace",
    "with-serde",
] }
# gRPC server for `TraceService/Export` (D-G-29). `router` is needed for `Server::builder().add_service`.
# No `zstd`: tonic's pulls `zstd` 0.14 next to the workspace's 0.13, and spec 02 asks for gzip only.
tonic = { version = "0.14.9", default-features = false, features = [
    "server",
    "router",
    "codegen",
    "gzip",
] }
regex = "1.13.1"
# Normalized Levenshtein for the similarity check (D164). Unicode scalar values.
strsim = "0.11.1"
sha2 = "0.11.1"
base64 = "0.23.1"
# Password hashing (D143). Defaults include `alloc`, `getrandom`, and `password-hash`.
argon2 = "0.6.0"
# OS CSPRNG for keys and salts (`SysRng`). Already resolved in `Cargo.lock`.
rand = "0.10.3"
# CLI credentials directory (P17).
dirs = "7.0.0"
# CLI credentials file (P17). Figment still uses toml 0.8.
toml = "1.2.1"
# CLI login and logout (P17), judges and webhooks (D166). rustls, no native-tls and no system proxy.
# `openidconnect` uses this pin.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
# OIDC discovery and id_token checks (D148). Same reqwest and rustls backend as `reqwest`.
openidconnect = { version = "4.1.0", default-features = false, features = ["reqwest", "rustls-tls"] }
# GitHub's OAuth 2 flow. Same HTTP backend as `openidconnect`.
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
# HMAC-SHA256 for webhook signatures (D165) and the OAuth state cookie (P24). RustCrypto 0.13, matching `sha2` 0.11.
hmac = "0.13.0"
# AES-256-GCM for sealed columns (D-I-2). Nonces come from the server's own random source, so the `getrandom` feature is not needed.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
# Constant-time compare of token hashes.
subtle = "2.6.1"
# OpenAPI 3.1 schemas. `uuid` enables the `format: uuid` schema. Do not enable
# `preserve_order` or `preserve_path_order`: default `BTreeMap`s keep the document sorted.
utoipa = { version = "6.0.0", features = ["uuid"] }
# Same major as axum 0.8's query decoding.
serde_urlencoded = "0.7.1"
tempfile = "3.27.0"
# OTLP property tests in llmobs-otel. MSRV 1.88. Tests enable `std` only.
proptest = "1.12.0"
# Mock identity-provider RS256 keys (tests only). `rand_core` 0.10 matches workspace `rand`.
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
# axum 0.8.9's body trait. The capture mock's stream implements it; axum does not re-export `Frame`.
http-body = "1.1.0"
# Capped request body reads (`Limited`) for OTLP ingest, and `oneshot` tests of the axum apps in llmobs-capture.
http-body-util = "0.1.5"
# gzip and deflate OTLP request bodies. Same version as `parquet`'s `flate2-zlib-rs` pin (`Cargo.lock`).
# `zlib-rs` is the backend parquet already uses, so no `miniz_oxide` is added.
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
# zstd OTLP request bodies. Same version as `parquet`'s pin (`Cargo.lock`). Default features stay off.
zstd = { version = "0.13.4", default-features = false }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2 # DataFusion/Arrow-heavy tests are unusably slow at opt-level 0

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only" # symbolized profiles and backtraces in production

[profile.bench]
inherits = "release"
debug = true
